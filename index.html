<style>
:root{
  --bg:#0b0d10; --surface:#14171c; --surface2:#1c2027; --surface3:#252a33;
  --line:#2b313b; --txt:#eceef1; --mut:#8f97a3; --dim:#636b78;
  --acc:#ff6a1f; --acc2:#ffa04d; --kb:#38bdf8; --bw:#a78bfa;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --r:14px; --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--txt);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---- layout ---- */
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:640px;margin:0 auto;position:relative}
header{
  padding:calc(var(--sat) + 12px) 16px 10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(11,13,16,.98),rgba(11,13,16,.86));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);
}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.14em;font-size:14px}
.logo b{color:var(--acc)}
.logo .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.spacer{flex:1}
.iconbtn{width:36px;height:36px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;font-size:17px;border:1px solid var(--line)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 96px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  padding:8px 8px calc(var(--sab) + 8px);
  background:rgba(14,17,21,.93);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);max-width:640px;margin:0 auto;
}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.06em}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}

/* ---- pieces ---- */
h2.sec{font-size:12px;letter-spacing:.16em;color:var(--dim);font-weight:700;margin:22px 2px 10px;text-transform:uppercase}
h2.sec:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.tap:active{background:var(--surface2);transform:scale(.99)}
.card.tap{transition:transform .1s}
.row{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ttl{font-weight:700;font-size:16px}
.sub{color:var(--mut);font-size:13px;margin-top:3px}
.tiny{color:var(--dim);font-size:11.5px;letter-spacing:.05em}
.badge{font-size:10px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:6px;background:var(--surface3);color:var(--mut);text-transform:uppercase;white-space:nowrap}
.badge.kb{background:rgba(56,189,248,.15);color:var(--kb)}
.badge.bw{background:rgba(167,139,250,.15);color:var(--bw)}
.badge.acc{background:rgba(255,106,31,.16);color:var(--acc2)}
.badge.mix{background:rgba(52,211,153,.15);color:var(--ok)}
.dots{display:flex;gap:3px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--surface3)}
.dots i.f{background:var(--acc)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:13px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:15px;width:100%}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,var(--acc),#e2520f);border-color:#ff804a;color:#fff;box-shadow:0 6px 20px rgba(255,106,31,.28)}
.btn.gho{background:transparent}
.btn.sm{padding:10px 12px;font-size:13.5px;border-radius:11px}
.btn.bad{color:var(--bad);border-color:rgba(248,113,113,.35)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 13px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on.kbc{background:var(--kb);border-color:var(--kb);color:#04212f}
.chip.on.bwc{background:var(--bw);border-color:var(--bw);color:#1b1035}

input[type=text],input[type=number],input[type=search],select,textarea{
  width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:16px;-webkit-appearance:none;appearance:none;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238f97a3' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:34px}
label.fld{display:block;margin-bottom:12px}
label.fld span{display:block;font-size:11.5px;letter-spacing:.1em;color:var(--dim);font-weight:700;text-transform:uppercase;margin-bottom:6px}

.sw{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.tog{width:50px;height:30px;border-radius:999px;background:var(--surface3);position:relative;transition:background .18s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s}
.tog.on{background:var(--acc)}
.tog.on::after{transform:translateX(20px)}

/* ---- exercise list ---- */
.ex{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:7px}
.ex:active{background:var(--surface2)}
.ex .mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:900;letter-spacing:.02em;flex:none}
.ex .mark.kb{background:rgba(56,189,248,.14);color:var(--kb)}
.ex .mark.bw{background:rgba(167,139,250,.14);color:var(--bw)}
.ex .meta{flex:1;min-width:0}
.ex .nm{font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex .gp{font-size:11.5px;color:var(--dim);margin-top:2px}

/* ---- sheet ---- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);z-index:70;opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:640px;margin:0 auto;
  background:var(--surface);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  max-height:92%;display:flex;flex-direction:column;
}
#sheet.on{transform:none}
.shead{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex:none}
.shead .grab{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--surface3)}
.shead .st{font-weight:800;font-size:17px;flex:1}
.sbody{padding:16px 16px calc(var(--sab) + 22px);overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---- runner ---- */
#runner{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--sat) + 10px) 16px calc(var(--sab) + 14px)}
#runner.on{display:flex}
#runner.work{background:#0d1a12}
#runner.rest{background:#1a1410}
#runner.prep{background:#101520}
#runner.flash{background:var(--acc)}
.rtop{display:flex;align-items:center;gap:10px;flex:none}
.rttl{font-weight:800;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.phase{font-size:13px;letter-spacing:.28em;font-weight:800;color:var(--acc2);text-transform:uppercase}
.clock{font-size:clamp(64px,23vw,130px);font-weight:800;line-height:.95;letter-spacing:-.03em;margin:6px 0}
.clock.sm{font-size:clamp(40px,14vw,76px)}
.sublbl{color:var(--mut);font-size:14px}
.ring{position:relative;width:min(74vw,300px);aspect-ratio:1;display:grid;place-items:center;margin:2px 0}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .bgc{stroke:rgba(255,255,255,.07)}
.ring .fgc{stroke:var(--acc);transition:stroke-dashoffset .18s linear}
.ring .inner{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 14px}
.movelist{width:100%;max-height:26vh;overflow-y:auto;margin-top:6px}
.mv{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;background:var(--surface);margin-bottom:6px;border:1px solid transparent}
.mv.cur{border-color:var(--acc);background:rgba(255,106,31,.1)}
.mv .r{font-weight:800;color:var(--acc2);font-size:14px;min-width:44px;text-align:right}
.mv .n{flex:1;text-align:left;font-size:14px}
.rbot{flex:none;display:grid;gap:9px}
.bigbtn{padding:20px;border-radius:16px;font-size:17px;font-weight:800;letter-spacing:.04em}
.counter{font-size:56px;font-weight:800;line-height:1}

.empty{text-align:center;padding:44px 20px;color:var(--dim)}
.empty .big{font-size:38px;margin-bottom:10px;opacity:.5}
.hr{height:1px;background:var(--line);margin:14px 0}

/* ---- movement diagram ---- */
.figwrap{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.figwrap svg{display:block;width:100%;height:auto}
.figcap{position:absolute;left:12px;bottom:9px;font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.figplay{position:absolute;right:9px;bottom:7px;width:28px;height:28px;border-radius:9px;background:var(--surface3);border:1px solid var(--line);color:var(--mut);font-size:10px;display:grid;place-items:center}
.btn.lnk{text-decoration:none;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.figwrap svg{opacity:.9}}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface2);font-size:12px;color:var(--mut);margin:0 6px 6px 0;border:1px solid var(--line)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:800}
.stat .k{font-size:10px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 90px);transform:translateX(-50%) translateY(20px);background:var(--surface3);border:1px solid var(--line);padding:11px 18px;border-radius:12px;z-index:90;opacity:0;transition:.25s;font-size:14px;font-weight:600;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.dragging{opacity:.4}
.stepper{display:flex;align-items:center;gap:0;background:var(--surface2);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.stepper button{width:44px;height:44px;font-size:20px;font-weight:700;color:var(--mut)}
.stepper button:active{background:var(--surface3)}
.stepper .val{flex:1;text-align:center;font-weight:800;font-size:16px}
</style>
</head>

<div id="app">

    <!-- ================= LOG ================= -->

      <h2 class="sec">Personal Records</h2>
      <div id="prList"></div>

    <button data-v="lib"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 015.5 4H9v16H5.5A1.5 1.5 0 014 18.5zM9 4h5.5A1.5 1.5 0 0116 5.5v13a1.5 1.5 0 01-1.5 1.5H9M18 6l2.5 12.5"/></svg>LIBRARY</button>
    <button data-v="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>TIMER</button>
    <button data-v="log"><svg viewBox="0 0 24 24"><path d="M4 19V6M4 19h16M8 16V9M12 16v-4M16 16V7M20 16v-3"/></svg>LOG</button>
  </nav>
</div>

<div id="scrim"></div>

  <div class="sbody" id="sheetBody"></div>
</div>

<div id="runner">
  <div class="rtop">
    <button class="iconbtn" id="rQuit">✕</button>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

/* ===== EXERCISE LIBRARY =====
   [ name, equip(bw|kb), group, level(1-3), tags, cues ]
   tags: push pull legs hinge core cardio skill mobility carry uni jump
         gear:bar gear:box gear:bench gear:wall gear:rope
*/
const RAW = [
/* ---------- BODYWEIGHT : PUSH ---------- */
["Push-Up","bw","Push",1,"push","Hands under shoulders, ribs down, glutes tight. Lower until the chest is a fist off the floor, elbows about 45° from the torso."],
["Knee Push-Up","bw","Push",1,"push","Knees down, but keep a straight line from knees to head. Same elbow path as a full push-up."],
["Incline Push-Up","bw","Push",1,"push gear:bench","Hands on a bench, box, or counter. The higher the hands, the easier it gets — the best way to earn a full push-up."],
["Decline Push-Up","bw","Push",2,"push gear:bench","Feet elevated on a bench or box. Shifts load onto the upper chest and shoulders."],
["Diamond Push-Up","bw","Push",2,"push","Index fingers and thumbs touching under the sternum. Elbows track back, not out. Heavy triceps."],
["Wide Push-Up","bw","Push",1,"push","Hands ~1.5x shoulder width. More chest, less triceps. Don't let the shoulders shrug up."],
["Archer Push-Up","bw","Push",3,"push uni","Wide hands. Bend one arm and lower toward that hand while the other arm stays straight. A one-arm push-up stepping stone."],
["Hindu Push-Up","bw","Push",2,"push mobility","Start in downward dog, dive the chest through low, finish in an upward dog. Great for shoulder mobility."],
["Pike Push-Up","bw","Push",2,"push","Hips high, body in an upside-down V. Lower the crown of the head toward the floor. Builds vertical pressing strength."],

["Wall Handstand Push-Up","bw","Push",3,"push skill gear:wall","Kick up to the wall, lower until the head lightly taps, press out. Keep the ribs down and don't arch."],
["One-Arm Push-Up","bw","Push",3,"push uni","Feet wide, free hand behind the back. Resist the urge to twist — keep the hips square to the floor."],
["Clapping Push-Up","bw","Push",3,"push jump","Explode off the floor hard enough to clap, land with soft elbows. Quality over quantity."],
["Spiderman Push-Up","bw","Push",2,"push core","As you lower, drive one knee to the same-side elbow. Alternate sides each rep."],
["Bench Dip","bw","Push",1,"push gear:bench","Hands on a bench behind you, legs out front. Lower until the upper arms are parallel, then press up."],
["Parallel Bar Dip","bw","Push",2,"push gear:bar","Slight forward lean, shoulders down and back. Lower until the shoulder is level with the elbow."],
["Ring / Bar Dip Hold","bw","Push",2,"push skill gear:bar","Support at the top with locked elbows and depressed shoulders. Hold for time."],
["Wall Handstand Hold","bw","Push",2,"skill gear:wall","Chest or back to the wall, arms locked, ribs down. Build up to 60 seconds."],

["Sphinx Push-Up","bw","Push",2,"push","From a forearm plank, press up onto the hands by extending only at the elbow. Isolated triceps work."],
["Hand-Release Push-Up","bw","Push",1,"push","Chest to the floor, lift both hands off, replace and press. Kills all bounce and momentum."],
["Wall Walk","bw","Push",3,"push skill core gear:wall","Start in a plank with feet on the wall, walk the hands in and the feet up until your chest is near the wall, then reverse."],

/* ---------- BODYWEIGHT : PULL ---------- */
["Pull-Up","bw","Pull",2,"pull gear:bar","Overhand grip, start from a dead hang. Pull the chest to the bar, chin clearly over. Control the way down."],
["Chin-Up","bw","Pull",2,"pull gear:bar","Underhand grip, shoulder width. More biceps than a pull-up and usually a few reps easier."],
["Neutral-Grip Pull-Up","bw","Pull",2,"pull gear:bar","Palms facing each other. Easiest on the shoulders and elbows of the three grips."],
["Chest-to-Bar Pull-Up","bw","Pull",3,"pull gear:bar","Pull until the chest actually contacts the bar. Lean back slightly and drive the elbows down and behind."],
["Kipping Pull-Up","bw","Pull",3,"pull skill gear:bar","Arch-to-hollow swing, then punch the hips and pull. Only worth learning after 5+ strict pull-ups."],
["Jumping Pull-Up","bw","Pull",1,"pull gear:bar","Bar at about wrist height overhead. Jump to get the chin over, then lower under control."],
["Negative Pull-Up","bw","Pull",1,"pull gear:bar","Jump or step to the top, then take 5 full seconds to lower. The fastest route to a first pull-up."],
["Banded Pull-Up","bw","Pull",1,"pull gear:bar","Loop a band over the bar and stand or kneel in it. Thicker band = more help out of the bottom."],
["Inverted Row","bw","Pull",1,"pull gear:bar","Bar at hip height, body straight, heels on the floor. Pull the chest to the bar and squeeze the shoulder blades."],
["Table Row","bw","Pull",1,"pull","No bar? Lie under a sturdy table, grip the edge, and row your chest to it."],
["Towel Row","bw","Pull",2,"pull","Loop a towel around a post, lean back and row. Adjust the angle to change the difficulty."],
["Scapular Pull-Up","bw","Pull",1,"pull gear:bar","Hang with straight arms, then pull the shoulder blades down and back without bending the elbows. Small range, huge payoff."],

["Archer Pull-Up","bw","Pull",3,"pull uni gear:bar","Wide grip. Pull toward one hand while the opposite arm stays nearly straight."],
["Commando Pull-Up","bw","Pull",3,"pull gear:bar","Straddle the bar with a mixed grip, pull the head alongside it — alternating sides."],
["Bar Muscle-Up","bw","Pull",3,"pull push skill gear:bar","Big kip, pull the bar to the hips, then a fast transition into the dip. Advanced skill work."],
["L-Sit Pull-Up","bw","Pull",3,"pull core gear:bar","Legs held out at 90° the whole rep. Ruthless on the abs and lats together."],
["Chin-Up Hold","bw","Pull",2,"pull gear:bar","Hold at the top with the chin over the bar. Great isometric when you can't add reps yet."],
["Superman","bw","Pull",1,"hinge core","Face down, lift the chest, arms and legs off the floor. Squeeze the glutes and hold or pulse."],

/* ---------- BODYWEIGHT : LEGS ---------- */
["Air Squat","bw","Legs",1,"legs","Feet shoulder width, knees track the toes, hips below parallel, chest up. Full standing lockout at the top."],
["Squat Jump","bw","Legs",2,"legs jump cardio","Squat to parallel then jump as high as possible. Land quietly and absorb into the next rep."],
["Jumping Lunge","bw","Legs",2,"legs jump uni cardio","Switch legs mid-air from lunge to lunge. Back knee kisses the floor each rep."],
["Forward Lunge","bw","Legs",1,"legs uni","Step out, drop the back knee to just off the floor, drive back to standing off the front heel."],

["Shrimp Squat","bw","Legs",3,"legs uni","Hold one ankle behind you, squat down until that knee touches the floor, stand back up."],

["Calf Raise","bw","Legs",1,"legs","Rise onto the toes, pause at the top, lower slowly. Do it off a step for a bigger stretch."],

["Skater Jump","bw","Legs",2,"legs jump uni cardio","Bound side to side, landing on one leg and holding a beat before the next bound."],
["Squat Hold","bw","Legs",1,"legs mobility","Sit in the bottom of a squat, chest tall, elbows pushing the knees out. Hold for time."],

["Sissy Squat","bw","Legs",3,"legs","Rise onto the toes and lean back, bending only at the knee. Brutal quad isolation — go slow."],

["Single-Leg Glute Bridge","bw","Hinge",2,"hinge uni","One foot down, other knee pulled in. Keep the hips level as you press up."],
["Hip Thrust","bw","Hinge",2,"hinge gear:bench","Upper back on a bench, drive the hips to full extension. Chin tucked, ribs down."],

["Windshield Wiper","bw","Core",3,"core gear:bar","Hanging or lying, legs together sweeping side to side under control."],
["Crunch","bw","Core",1,"core","Small range, lift the shoulder blades off the floor and squeeze the abs."],
["Reverse Crunch","bw","Core",1,"core","Knees to the chest, curl the hips off the floor. Don't use momentum."],
["Copenhagen Plank","bw","Core",3,"core uni gear:bench","Top foot on a bench, side plank position. Ferocious adductor work."],
["Side Plank Hip Dip","bw","Core",2,"core uni","From a side plank, lower the hip toward the floor and drive it back up."],
["Hollow Body Flutter","bw","Core",2,"core","Hold the hollow shape and flutter the legs. Stop the moment the low back lifts."],
["Bear Hold","bw","Core",1,"core","On hands and toes with the knees hovering an inch off the floor. Flat back, still hips."],

["Inchworm","bw","Conditioning",1,"cardio mobility","Hinge, walk the hands to a plank, walk them back, stand. Add a push-up to make it hurt."],

["Line Hops","bw","Conditioning",1,"cardio jump","Fast two-foot hops forward and back over a line for time."],
["Shuttle Run","bw","Conditioning",1,"cardio","Sprint out, touch the line, sprint back. Set a distance and repeat."],

let AC = null, audioReady = false;
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource();
    s.buffer = b; s.connect(AC.destination); s.start(0);
    audioReady = true;
  } catch (e) { }
}
function beep(freq, dur, vol, type) {
  if (!S.sound || !AC) return;
  try {
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0, AC.currentTime);
    g.gain.linearRampToValueAtTime(vol == null ? .28 : vol, AC.currentTime + .012);
    g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur + .02);
  } catch (e) { }
}

/* ---- which archetype fits a movement? conservative: no guess, no diagram ---- */
function animKey(e) {
  const n = e.name.toLowerCase(), g = e.group;

  /* explicit name matches win */
  if (/pull-up|chin-up|pullup|chinup|lat pull/.test(n)) return "pullup";
  if (/swing/.test(n)) return "swing";
  if (/lunge|split squat|step-up|step up/.test(n)) return "lunge";
  if (/plank|hollow|dead ?bug|hold|carry|march/.test(n)) return "plank";
  if (/push-?up/.test(n) && !/pike|handstand|hindu/.test(n)) return "pushup";
  if (/deadlift|good morning|romanian|rdl|hinge/.test(n)) return "hinge";
  if (/squat/.test(n)) return "squat";
  if (/press|jerk/.test(n) && !/leg press/.test(n)) return "press";

  /* group fallbacks, only where the whole group shares one shape */
  if (g === "Squat") return "squat";
  if (g === "Hinge") return "hinge";
  if (g === "Ballistic") return "swing";
  if (g === "Press") return "press";
  if (g === "Pull" && e.eq === "bw") return "pullup";
  if (g === "Push" && e.eq === "bw") return "pushup";
  if (g === "Carry") return "plank";

  return null;
}

/* ---- interpolate + paint ---- */
function figPaint(root, A, t) {
  const p = A.poses, n = p.length;
  const seq = A._seq || (A._seq = n === 1 ? [0] :
    [...p.keys(), ...[...p.keys()].slice(1, -1).reverse()]);
  const L = seq.length, f = t * L, i = Math.floor(f), u = f - i;
  const a = p[seq[i % L]], b = p[seq[(i + 1) % L]];
  const e = (1 - Math.cos(Math.PI * u)) / 2;
  const V = {};
  J.forEach((k, idx) => {
    V[k] = [a[idx * 2] + (b[idx * 2] - a[idx * 2]) * e,
            a[idx * 2 + 1] + (b[idx * 2 + 1] - a[idx * 2 + 1]) * e];
  });

  const set = (id, p1, p2) => {
    const el = root.querySelector("#" + id); if (!el) return;
    el.setAttribute("x1", p1[0]); el.setAttribute("y1", p1[1]);
    el.setAttribute("x2", p2[0]); el.setAttribute("y2", p2[1]);
  };
  set("f-spine", V.N, V.P);
  set("f-u1", V.N, V.E1); set("f-l1", V.E1, V.W1);
  set("f-u2", V.N, V.E2); set("f-l2", V.E2, V.W2);
  set("f-t1", V.P, V.K1); set("f-s1", V.K1, V.F1);
  set("f-u2b", V.P, V.K2); set("f-l2b", V.K2, V.F2);

  const h = root.querySelector("#f-head");
  if (h) { h.setAttribute("cx", V.H[0]); h.setAttribute("cy", V.H[1]); }

  const bl = root.querySelector("#f-bell");
  if (bl && A.bell) {
    const ba = A.bell[seq[i % L]] || A.bell[0], bb = A.bell[seq[(i + 1) % L]] || A.bell[0];
    bl.setAttribute("transform",
      "translate(" + (ba[0] + (bb[0] - ba[0]) * e).toFixed(2) + "," +
                     (ba[1] + (bb[1] - ba[1]) * e).toFixed(2) + ")");
  }
}

/* ---- run one figure; returns a stop() ---- */
let figRAF = null;
function figStart(root, A) {
  figStop();
  const t0 = performance.now();
  let paused = false;
  const step = now => {
    if (!document.body.contains(root)) { figStop(); return; }
    if (!paused) figPaint(root, A, ((now - t0) % A.ms) / A.ms);
    figRAF = requestAnimationFrame(step);
  };
  figPaint(root, A, 0);
  figRAF = requestAnimationFrame(step);
  return { pause: v => { paused = v; } };
}
function figStop() { if (figRAF) { cancelAnimationFrame(figRAF); figRAF = null; } }

/* default rep prescription for a movement */
function defReps(e, mult) {
  mult = mult || 1;
  if (isHold(e)) return (e.tags.includes("carry") ? 30 : 30) * mult + "s" + (e.uni ? "/side" : "");
  const base = {
    Push: 10, Pull: 6, Legs: 15, Hinge: 12, Core: 15, Conditioning: 12, Skill: 5, Mobility: 10,
    Ballistic: 15, Press: 6, Squat: 10, Grind: 2, Carry: 30, Complex: 5
  }[e.group] || 10;
  let r = Math.round(base * mult);
  if (e.eq === "kb" && e.uni) return r + "/side";
  return String(r);
}

/* ==================== RUNNER ==================== */
let RUN = null, rafId = null;
const RC = 282.74; // ring circumference

function buildSegments(t) {
  const segs = [];
  for (let s = 0; s < t.sets; s++) {
    for (let r = 0; r < t.ivRounds; r++) {
      segs.push({ type: "work", dur: t.work, round: r + 1, set: s + 1 });
      if (t.rest > 0) segs.push({ type: "rest", dur: t.rest, round: r + 1, set: s + 1 });
    }
    if (s < t.sets - 1 && t.setRest > 0) segs.push({ type: "rest", dur: t.setRest, round: t.ivRounds, set: s + 1, setBreak: true });
  }
  return segs;
}

function itemsHTML(items, curIdx, ascendRep) {
  if (!items || !items.length) return "";
  return items.map((it, i) => `<div class="mv ${curIdx === i ? "cur" : ""}"><span class="r num">${esc(ascendRep != null ? ascendRep : (it.r || "·"))}</span><span class="n">${esc(it.n)}</span></div>`).join("");
}

function startRun(t, name) {
  const cfg = JSON.parse(JSON.stringify(t));
  RUN = {
    cfg, name: name || "Workout", mode: cfg.mode,
    t0: performance.now(), pauseAcc: 0, pauseStart: 0, paused: false, running: true,
    prep: S.prep, lastSec: -999, rounds: 0, splits: [], finished: false,
    segs: cfg.mode === "interval" ? buildSegments(cfg) : null, curSeg: -1, curRound: -1
  };
  if (RUN.segs) RUN.segTotal = RUN.segs.reduce((a, s) => a + s.dur, 0);
  $("#runner").classList.add("on");
  $("#rTitle").textContent = RUN.name;
  updateSoundIcon();
  buildRunnerUI();
  keepAwake(true);
  loop();
}

  const t = RUN.cfg;
  const ring = `<div class="ring"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="45"/><circle class="fgc" id="rRing" cx="50" cy="50" r="45" stroke-dasharray="${RC}" stroke-dashoffset="0"/></svg>
    <div class="inner"><div class="clock num" id="rClock">--</div><div class="sublbl num" id="rSub"></div></div></div>`;
  let mid = `<div class="phase" id="rPhase">GET READY</div>` + ring + `<div class="movelist" id="rMoves"></div>`;
  if (RUN.mode === "amrap") {
    mid = `<div class="phase" id="rPhase">AMRAP ${fmtLong(t.amrapSec)}</div>` + ring +
      `<div class="movelist" id="rMoves"></div>`;
  }
  $("#rMid").innerHTML = mid;

  let bot = "";
  if (RUN.mode === "amrap") {
    bot = `<button class="btn pri bigbtn" id="rRound">＋ ROUND <span class="num" id="rCount">0</span></button>
      <div class="grid2"><button class="btn" id="rPause">PAUSE</button><button class="btn bad" id="rDone">FINISH</button></div>`;
  } else if (RUN.mode === "fortime") {
    bot = `<div class="grid2"><button class="btn" id="rLap">LAP <span class="num" id="rCount">0</span></button><button class="btn" id="rPause">PAUSE</button></div>
      <button class="btn pri bigbtn" id="rDone">DONE — STOP THE CLOCK</button>`;
  } else {
    bot = `<div class="grid2"><button class="btn" id="rPause">PAUSE</button><button class="btn bad" id="rDone">FINISH</button></div>`;
  }

  const rp = $("#rPause"); if (rp) rp.onclick = togglePause;
  const rd = $("#rDone"); if (rd) rd.onclick = () => finishRun(false);
  const rr = $("#rRound"); if (rr) rr.onclick = () => { RUN.rounds++; RUN.splits.push(elapsed()); $("#rCount").textContent = RUN.rounds; sTick(); };
  const rl = $("#rLap"); if (rl) rl.onclick = () => { RUN.rounds++; RUN.splits.push(elapsed()); $("#rCount").textContent = RUN.rounds; sTick(); };
  $("#rMoves").innerHTML = itemsHTML(t.items, -1);
}

function elapsed() {
  const now = RUN.paused ? RUN.pauseStart : performance.now();
  return (now - RUN.t0 - RUN.pauseAcc) / 1000 - RUN.prep;
}
function togglePause() {
  if (!RUN) return;
  if (RUN.paused) { RUN.pauseAcc += performance.now() - RUN.pauseStart; RUN.paused = false; $("#rPause").textContent = "PAUSE"; loop(); }
  else { RUN.paused = true; RUN.pauseStart = performance.now(); $("#rPause").textContent = "RESUME"; cancelAnimationFrame(rafId); }
}
function setRing(frac) {
  const r = $("#rRing"); if (r) r.setAttribute("stroke-dashoffset", RC * (1 - clamp(frac, 0, 1)));
}
function flash(on) { if (S.flash) $("#runner").classList.toggle("flash", !!on); }

function loop() {
  rafId = requestAnimationFrame(loop);
  tick();
}

function tick() {
  if (!RUN || RUN.finished) return;
  const e = elapsed(), t = RUN.cfg, R = $("#runner");
  const whole = Math.floor(e);

  /* ---- prep countdown ---- */
  if (e < 0) {
    const left = Math.ceil(-e);
    R.className = "on prep";
    $("#rPhase").textContent = "GET READY";
    $("#rClock").textContent = left;
    $("#rSub").textContent = RUN.name;
    setRing(1 + e / RUN.prep);
    if (whole !== RUN.lastSec) {
      RUN.lastSec = whole;
      if (left <= 3 && left > 0) { sTick(); say(String(left)); }
    }
    return;
  }
  if (RUN.lastSec < 0 && e >= 0) { sGo(); say("Go"); RUN.lastSec = 0; }

  /* ---- EMOM ---- */
  if (RUN.mode === "emom") {
    const total = t.interval * t.rounds;
    if (e >= total) return finishRun(true);
    const rd = Math.floor(e / t.interval);
    const left = t.interval - (e % t.interval);
    R.className = "on";
    $("#rPhase").textContent = `ROUND ${rd + 1} OF ${t.rounds}`;
    $("#rClock").textContent = fmtLong(Math.ceil(left));
    $("#rSub").textContent = "total " + fmtLong(total - e);
    setRing(left / t.interval);
    if (rd !== RUN.curRound) {
      RUN.curRound = rd; RUN.rounds = rd + 1;
      const ci = t.alt && t.items.length ? rd % t.items.length : -1;
      $("#rMoves").innerHTML = itemsHTML(t.items, ci, t.ascend ? rd + 1 : null);
      if (rd > 0) { sRound(); flash(true); setTimeout(() => flash(false), 220); }
      const cur = t.alt && t.items.length ? t.items[ci] : null;
      if (rd > 0) say(cur ? cur.n : "Round " + (rd + 1));
    }
    if (whole !== RUN.lastSec) {
      RUN.lastSec = whole;
      const l = Math.ceil(left);
      if (l <= 3 && l > 0 && e > 1) sTick();
    }
    return;
  }

  /* ---- AMRAP ---- */
  if (RUN.mode === "amrap") {
    const left = t.amrapSec - e;
    if (left <= 0) return finishRun(true);
    R.className = "on";
    $("#rClock").textContent = fmtLong(Math.ceil(left));
    $("#rSub").textContent = "elapsed " + fmtLong(e);
    $("#rPhase").textContent = `AMRAP · ${RUN.rounds} ROUND${RUN.rounds === 1 ? "" : "S"}`;
    setRing(left / t.amrapSec);
    if (whole !== RUN.lastSec) {
      RUN.lastSec = whole;
      const l = Math.ceil(left);
      if (l <= 3 && l > 0) sTick();
      else if (l === 60 && t.amrapSec > 120) { sRest(); say("One minute"); }
    }
    return;
  }

  /* ---- FOR TIME ---- */
  if (RUN.mode === "fortime") {
    R.className = "on";
    if (t.capSec && e >= t.capSec) return finishRun(true);
    $("#rClock").textContent = fmtLong(e);
    $("#rPhase").textContent = "FOR TIME";
    $("#rSub").textContent = t.capSec ? "cap in " + fmtLong(t.capSec - e) : (RUN.splits.length ? "last split " + fmtLong(RUN.splits[RUN.splits.length - 1]) : "go");
    setRing(t.capSec ? 1 - e / t.capSec : (e % 60) / 60);
    if (whole !== RUN.lastSec) {
      RUN.lastSec = whole;
      if (t.capSec) { const l = Math.ceil(t.capSec - e); if (l <= 3 && l > 0) sTick(); }
    }
    return;
  }

  /* ---- INTERVALS ---- */
  if (RUN.mode === "interval") {
    let acc = 0, idx = -1, segLeft = 0, seg = null;
    for (let i = 0; i < RUN.segs.length; i++) {
      if (e < acc + RUN.segs[i].dur) { idx = i; seg = RUN.segs[i]; segLeft = acc + RUN.segs[i].dur - e; break; }
      acc += RUN.segs[i].dur;
    }
    if (idx === -1) return finishRun(true);
    R.className = "on " + seg.type;
    $("#rPhase").textContent = seg.setBreak ? "SET BREAK" : seg.type.toUpperCase();
    $("#rClock").textContent = fmtLong(Math.ceil(segLeft));
    $("#rSub").textContent = `round ${seg.round}/${t.ivRounds}` + (t.sets > 1 ? ` · set ${seg.set}/${t.sets}` : "") + ` · total ${fmtLong(RUN.segTotal - e)}`;
    setRing(segLeft / seg.dur);
    if (idx !== RUN.curSeg) {
      RUN.curSeg = idx;
      RUN.rounds = seg.round + (seg.set - 1) * t.ivRounds;
      const ci = t.items.length ? (seg.round - 1) % t.items.length : -1;
      $("#rMoves").innerHTML = itemsHTML(t.items, seg.type === "work" ? ci : -1);
      if (seg.type === "work") { sRound(); flash(true); setTimeout(() => flash(false), 220); say(t.items.length ? t.items[ci].n : "Work"); }
      else { sRest(); say(seg.setBreak ? "Set break" : "Rest"); }
    }
    if (whole !== RUN.lastSec) {
      RUN.lastSec = whole;
      const l = Math.ceil(segLeft);
      if (l <= 3 && l > 0) sTick();
    }
    return;
  }
}

function finishRun(natural) {
  if (!RUN || RUN.finished) return;
  RUN.finished = true; RUN.running = false;
  cancelAnimationFrame(rafId);
  keepAwake(false);
  const e = Math.max(0, elapsed()), t = RUN.cfg;
  sDone(); say("Time");
  $("#runner").className = "on";

  let result = {}, headline = "";
  if (RUN.mode === "fortime") {
    const capped = t.capSec && e >= t.capSec;
    result = { timeSec: Math.round(e), capped: !!capped, rounds: RUN.rounds };
    headline = capped ? "Time capped at " + fmtLong(t.capSec) : fmtLong(e);
  } else if (RUN.mode === "amrap") {
    result = { rounds: RUN.rounds, timeSec: Math.round(Math.min(e, t.amrapSec)) };
    headline = RUN.rounds + " round" + (RUN.rounds === 1 ? "" : "s");
  } else if (RUN.mode === "emom") {
    const done = clamp(Math.ceil(e / t.interval), 0, t.rounds);
    result = { rounds: done, timeSec: Math.round(e) };
    headline = done + " / " + t.rounds + " rounds";
  } else {
    const done = RUN.rounds || 0;
    result = { rounds: done, timeSec: Math.round(e) };
    headline = fmtLong(e) + " · " + done + " rounds";
  }
  RUN.result = result; RUN.headline = headline;
  showFinish(natural);
}

function showFinish(natural) {
  const t = RUN.cfg, r = RUN.result;
  const prev = bestFor(RUN.name, RUN.mode);
  let prMsg = "";
  if (prev) {
    const better = RUN.mode === "fortime" ? (r.timeSec < prev.r.timeSec && !r.capped) : (r.rounds > prev.r.rounds);
    prMsg = better
      ? `<div class="card" style="border-color:var(--ok);background:rgba(52,211,153,.08)"><b style="color:var(--ok)">🏆 New personal record</b><div class="sub">Previous best: ${scoreText(prev.mode, prev.r)}</div></div>`
      : `<div class="tiny" style="margin-bottom:10px">Your best so far: ${scoreText(prev.mode, prev.r)}</div>`;
  }
  const splits = RUN.splits.length ? `<div class="hr"></div><div class="tiny" style="margin-bottom:6px">SPLITS</div>` +
    RUN.splits.map((s, i) => `<div class="row" style="justify-content:space-between;padding:4px 0;font-size:13.5px"><span style="color:var(--mut)">Round ${i + 1}</span><span class="num">${fmtLong(s)}${i ? ` <span style="color:var(--dim)">(+${fmtLong(s - RUN.splits[i - 1])})</span>` : ""}</span></div>`).join("") : "";

  $("#rMid").innerHTML = `<div class="phase" style="color:var(--ok)">${natural ? "TIME" : "COMPLETE"}</div>
    <div class="clock num" style="font-size:clamp(44px,15vw,86px)">${esc(RUN.headline)}</div>
    <div class="sublbl">${esc(RUN.name)}</div>`;
  $("#rBot").innerHTML = `<button class="btn pri bigbtn" id="fSave">SAVE TO LOG</button>
    <div class="grid2"><button class="btn" id="fAgain">REPEAT</button><button class="btn gho" id="fSkip">DISCARD</button></div>`;

  $("#fSave").onclick = () => {
    openSheet("Save result", `${prMsg}
      <label class="fld"><span>Workout name</span><input type="text" id="fN" value="${esc(RUN.name)}"></label>
      <div class="card" style="text-align:center"><div style="font-size:30px;font-weight:800" class="num">${esc(RUN.headline)}</div><div class="tiny">${MODES.find(m => m.k === RUN.mode).n}</div></div>
      ${RUN.mode === "amrap" ? `<label class="fld"><span>Extra reps past the last full round</span><input type="number" id="fX" inputmode="numeric" placeholder="0"></label>` : ""}
      <label class="fld"><span>Notes (optional)</span><textarea id="fNotes" rows="2" placeholder="Bell weight, how it felt, scaling…">${S.kbw ? esc(S.kbw) + " bell" : ""}</textarea></label>
      ${splits}
      <button class="btn pri" id="fOk">Save</button>`);
    $("#fOk").onclick = () => {
      const x = $("#fX");
      HIST.unshift({
        id: uid(), ts: Date.now(), name: $("#fN").value.trim() || RUN.name, mode: RUN.mode,
        r: Object.assign({}, RUN.result, x && x.value ? { extra: +x.value } : {}),
        items: RUN.cfg.items, splits: RUN.splits.map(s => Math.round(s)), notes: $("#fNotes").value.trim(),
        cfgText: cfgText(RUN.cfg)
      });
      saveHist(); closeSheet(); closeRunner(); renderLog(); go("log"); toast("Logged 💪");
    };
  };
  $("#fAgain").onclick = () => { const c = RUN.cfg, n = RUN.name; closeRunner(); setTimeout(() => startRun(c, n), 120); };
  $("#fSkip").onclick = closeRunner;
}

function closeRunner() {
  cancelAnimationFrame(rafId); keepAwake(false);
  $("#runner").classList.remove("on"); $("#runner").className = "";
  RUN = null;
}
$("#rQuit").onclick = () => {
  if (!RUN) return closeRunner();
  if (RUN.finished) return closeRunner();
  if (elapsed() > 5) { if (!confirm("Quit this workout? Nothing will be saved.")) return; }
  closeRunner();
};

function cfgText(t) {
  if (t.mode === "emom") return `EMOM · ${cfgDetail(t)}`;
  if (t.mode === "amrap") return `AMRAP · ${cfgDetail(t)}`;
  if (t.mode === "fortime") return `For time · ${cfgDetail(t)}`;
  return `Intervals · ${cfgDetail(t)}`;
}
function cfgDetail(t) {
  if (t.mode === "emom") return `${t.rounds} × ${t.interval < 60 ? t.interval + "s" : fmtLong(t.interval).replace(/^0/, "") + " min"}`;
  if (t.mode === "amrap") return fmtLong(t.amrapSec).replace(/^0/, "") + " min";
  if (t.mode === "fortime") return t.capSec ? `${fmtLong(t.capSec)} cap` : "no cap";
  return `${t.work}s on / ${t.rest}s off × ${t.ivRounds}${t.sets > 1 ? " × " + t.sets + " sets" : ""}`;
}
function scoreText(mode, r) {
  if (mode === "fortime") return (r.capped ? "capped " : "") + fmtLong(r.timeSec);
  if (mode === "amrap") return r.rounds + " rds" + (r.extra ? " + " + r.extra : "");
  return r.rounds + " rds";
}
function bestFor(name, mode) {
  const l = HIST.filter(h => h.name === name && h.mode === mode);
  if (!l.length) return null;
  if (mode === "fortime") { const v = l.filter(h => !h.r.capped); if (!v.length) return null; return v.reduce((a, b) => b.r.timeSec < a.r.timeSec ? b : a); }
  return l.reduce((a, b) => (b.r.rounds + (b.r.extra || 0) / 1000) > (a.r.rounds + (a.r.extra || 0) / 1000) ? b : a);
}

    name: "Swing & Burpee 21-15-9", eq: "mix", mode: "fortime", capSec: 900,
    desc: "Two movements, three rounds, descending reps. Under ten minutes if you're honest with yourself.",
    items: [{ n: "KB Two-Hand Swing", r: "21-15-9" }, { n: "Burpee", r: "21-15-9" }]
  },
  {
    name: "Ten Rounds", eq: "mix", mode: "fortime", capSec: 1800,
    desc: "Ten rounds of the same three movements. Tap LAP at the end of each round to see how much you slow down.",
    items: [{ n: "KB Clean & Press", r: "5/side ×10 rds" }, { n: "Pull-Up", r: "5 ×10 rds" }, { n: "Air Squat", r: "10 ×10 rds" }]
  }
];
PRESETS.forEach((p, i) => { p.id = "p" + i; p.preset = true; });

function presetToTM(p) {
  return Object.assign({
    mode: p.mode, name: p.name, interval: 60, rounds: 10, alt: false, ascend: false,
    amrapSec: 720, capSec: 0, work: 30, rest: 30, ivRounds: 8, sets: 1, setRest: 60, items: []
  }, p);
}

/* ==================== TRAIN VIEW ==================== */
let PF = "all";
function renderTrain() {
  $("#quickStart").innerHTML = MODES.map(m => `<button class="card tap" data-qs="${m.k}" style="text-align:left;margin:0">
    <div class="ttl" style="color:var(--acc)">${m.n}</div><div class="sub" style="font-size:12px">${m.d}</div></button>`).join("");
  $$("[data-qs]").forEach(b => b.onclick = () => { TM.mode = b.dataset.qs; TM.name = ""; saveTM(); renderTimer(); go("timer"); });

  $("#myWorkouts").innerHTML = MYW.length ? MYW.map(w => wCard(w)).join("")
    : `<div class="tiny" style="padding:2px 2px 10px">Nothing saved yet. Build one below, or save a preset after you tweak it.</div>`;

  $("#presetChips").innerHTML = [["all", "All"], ["bw", "Bodyweight"], ["kb", "Kettlebell"], ["mix", "Mixed"]]
    .map(([k, l]) => `<button class="chip ${PF === k ? "on" : ""}" data-pf="${k}">${l}</button>`).join("");
  $$("[data-pf]").forEach(b => b.onclick = () => { PF = b.dataset.pf; renderTrain(); });
  $("#presetList").innerHTML = PRESETS.filter(p => PF === "all" || p.eq === PF).map(p => wCard(p)).join("");

  $$("[data-w]").forEach(b => b.onclick = () => {
    const id = b.dataset.w;
    showWorkout(PRESETS.find(p => p.id === id) || MYW.find(w => w.id === id));
  });
}
function wCard(w) {
  const best = bestFor(w.name, w.mode);
  return `<button class="card tap" data-w="${w.id}" style="text-align:left;display:block;width:100%">
    <div class="row"><div style="flex:1;min-width:0">
      <div class="ttl">${esc(w.name)}</div>
      <div class="sub">${cfgText(presetToTM(w))}${w.items && w.items.length ? " · " + w.items.length + " movement" + (w.items.length === 1 ? "" : "s") : ""}</div>
    </div>
    <span class="badge ${w.eq || "acc"}">${w.eq === "kb" ? "KB" : w.eq === "bw" ? "BW" : w.eq === "mix" ? "MIX" : "MINE"}</span></div>
    ${best ? `<div class="tiny" style="margin-top:8px;color:var(--ok)">PR ${scoreText(best.mode, best.r)}</div>` : ""}
  </button>`;
}

function showWorkout(w) {
  if (!w) return;
  const t = presetToTM(w);
  const best = bestFor(w.name, w.mode);
  const past = HIST.filter(h => h.name === w.name).slice(0, 4);
  openSheet(w.name, `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <span class="badge acc">${MODES.find(m => m.k === w.mode).n}</span>
      <span class="badge">${cfgDetail(t)}</span>
      ${w.eq ? `<span class="badge ${w.eq}">${w.eq === "kb" ? "Kettlebell" : w.eq === "bw" ? "Bodyweight" : "Mixed"}</span>` : ""}
    </div>
    ${w.desc ? `<div style="color:#d6dae0;font-size:15px;line-height:1.5;margin-bottom:14px">${esc(w.desc)}</div>` : ""}
    ${t.items.length ? `<div class="tiny" style="margin-bottom:7px">MOVEMENTS</div>` + t.items.map(it => `<div class="mv"><span class="r">${esc(it.r || "·")}</span><span class="n">${esc(it.n)}</span></div>`).join("") : ""}
    ${best ? `<div class="card" style="margin-top:12px;border-color:rgba(52,211,153,.35)"><div class="tiny">YOUR BEST</div><div style="font-size:22px;font-weight:800" class="num">${scoreText(best.mode, best.r)}</div><div class="tiny">${new Date(best.ts).toLocaleDateString()}</div></div>` : ""}
    ${past.length ? `<div class="tiny" style="margin:14px 0 6px">RECENT</div>` + past.map(h => `<div class="row" style="justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line)"><span style="color:var(--mut)">${new Date(h.ts).toLocaleDateString()}</span><span class="num">${scoreText(h.mode, h.r)}</span></div>`).join("") : ""}
    <div class="hr"></div>
    <button class="btn pri" id="wStart">START</button>
    <div style="height:9px"></div>
    <div class="grid2"><button class="btn" id="wLoad">Load into timer</button>${w.preset ? `<button class="btn gho" id="wCopy">Save a copy</button>` : `<button class="btn bad" id="wDel">Delete</button>`}</div>
  `);
  $("#wStart").onclick = () => { closeSheet(); initAudio(); startRun(t, w.name); };
  $("#wLoad").onclick = () => { TM = t; saveTM(); renderTimer(); closeSheet(); go("timer"); };
  const c = $("#wCopy"); if (c) c.onclick = () => { const n = JSON.parse(JSON.stringify(t)); n.id = uid(); n.preset = false; MYW.unshift(n); saveMyw(); renderTrain(); closeSheet(); toast("Saved to My Workouts"); };
  const d = $("#wDel"); if (d) d.onclick = () => { if (!confirm("Delete this workout?")) return; MYW = MYW.filter(x => x.id !== w.id); saveMyw(); renderTrain(); closeSheet(); };
}

$("#btnBuild").onclick = () => { TM.items = []; TM.name = ""; saveTM(); renderTimer(); go("timer"); toast("Pick a format, then add movements"); };

/* ==================== GENERATOR ==================== */
let GEN = store.get("gen", { eq: "both", mins: 20, fmt: "auto", focus: "full", diff: "bal" });
const saveGen = () => store.set("gen", GEN);

$("#btnGen").onclick = () => openGen();

function chipRow(id, opts, cur) {
  return `<div class="chips">${opts.map(([k, l]) => `<button class="chip ${cur === k ? "on" : ""}" data-${id}="${k}">${l}</button>`).join("")}</div>`;
}
function openGen() {
  openSheet("Random Workout", `
    <div class="tiny">EQUIPMENT</div>${chipRow("ge", [["both", "Both"], ["bw", "Bodyweight only"], ["kb", "Kettlebell only"]], GEN.eq)}
    <div class="tiny">TIME</div>${chipRow("gm", [[8, "8 min"], [10, "10"], [12, "12"], [15, "15"], [20, "20"], [25, "25"], [30, "30"], [40, "40"]], GEN.mins)}
    <div class="tiny">FORMAT</div>${chipRow("gf", [["auto", "Surprise me"], ["emom", "EMOM"], ["amrap", "AMRAP"], ["fortime", "For time"], ["interval", "Intervals"]], GEN.fmt)}
    <div class="tiny">FOCUS</div>${chipRow("go", [["full", "Full body"], ["upper", "Upper"], ["lower", "Lower"], ["core", "Core"], ["engine", "Conditioning"]], GEN.focus)}
    <div class="tiny">DIFFICULTY</div>${chipRow("gd", [["easy", "Easier"], ["bal", "Balanced"], ["hard", "Bring it"]], GEN.diff)}
    <div class="hr"></div>
    <button class="btn pri" id="genGo">Generate</button>`);
  const rebind = () => {
    [["ge", "eq"], ["gm", "mins"], ["gf", "fmt"], ["go", "focus"], ["gd", "diff"]].forEach(([d, k]) =>
      $$(`[data-${d}]`).forEach(b => b.onclick = () => { GEN[k] = k === "mins" ? +b.dataset[d] : b.dataset[d]; saveGen(); openGen(); }));
    $("#genGo").onclick = () => showGenerated(generate());
  };
  rebind();
}

const PATTERNS = {
  full: ["push", "pull", "legs", "core"], upper: ["push", "pull", "push", "pull"],
  lower: ["legs", "hinge", "legs", "core"], core: ["core", "core", "core", "carry"],
  engine: ["cardio", "legs", "cardio", "push"]
};
function generate() {
  const maxLvl = GEN.diff === "easy" ? 1 : GEN.diff === "bal" ? 2 : 3;
  const pool = EX.filter(e => (GEN.eq === "both" || e.eq === GEN.eq) && gearOk(e) && e.level <= maxLvl
    && !["Mobility", "Skill"].includes(e.group) && !e.tags.includes("mobility"));
  const pats = shuffle(PATTERNS[GEN.focus]);
  const n = GEN.mins <= 10 ? 3 : GEN.mins <= 20 ? 4 : 5;
  const chosen = [];
  for (let i = 0; chosen.length < n && i < 40; i++) {
    const p = pats[chosen.length % pats.length];
    let c = pool.filter(e => e.tags.includes(p) && !chosen.some(x => x.id === e.id));
    if (!c.length) c = pool.filter(e => !chosen.some(x => x.id === e.id));
    if (!c.length) break;
    chosen.push(pick(c));
  }
  const fmt = GEN.fmt === "auto" ? pick(["emom", "amrap", "fortime", "interval"]) : GEN.fmt;
  const t = presetToTM({ mode: fmt, items: [] });
  t.name = `${GEN.mins} min ${{ full: "Full Body", upper: "Upper", lower: "Lower", core: "Core", engine: "Conditioning" }[GEN.focus]}`;
  t.eq = GEN.eq === "both" ? "mix" : GEN.eq;

  if (fmt === "emom") {
    t.interval = 60; t.rounds = GEN.mins; t.alt = true;
    t.items = chosen.map(e => ({ n: e.name, r: defReps(e, 1.1) }));
  } else if (fmt === "amrap") {
    t.amrapSec = GEN.mins * 60;
    t.items = chosen.map(e => ({ n: e.name, r: defReps(e, .7) }));
  } else if (fmt === "fortime") {
    const rds = GEN.mins <= 12 ? 3 : GEN.mins <= 20 ? 5 : 7;
    t.capSec = GEN.mins * 60;
    t.items = chosen.map(e => ({ n: e.name, r: defReps(e, .8) }));
    t.rds = rds;
    t.name = `${rds} Rounds · ` + t.name;
  } else {
    t.work = GEN.diff === "hard" ? 45 : 40; t.rest = GEN.diff === "easy" ? 30 : 20;
    t.ivRounds = chosen.length;
    t.sets = Math.max(1, Math.round(GEN.mins * 60 / ((t.work + t.rest) * chosen.length)));
    t.setRest = 0;
    t.items = chosen.map(e => ({ n: e.name, r: "max reps" }));
  }
  const warm = shuffle(EX.filter(e => e.group === "Mobility" && gearOk(e))).slice(0, 3);
  t.warm = warm.map(e => e.name);
  return t;
}
function showGenerated(t) {
  openSheet(t.name, `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <span class="badge acc">${MODES.find(m => m.k === t.mode).n}</span><span class="badge">${cfgDetail(t)}</span>
    </div>
    <div class="tiny" style="margin-bottom:7px">WARM UP · 5 MIN</div>
    ${t.warm.map(w => `<div class="mv"><span class="n">${esc(w)}</span></div>`).join("")}
    <div class="tiny" style="margin:14px 0 7px">${t.mode === "fortime" ? `${t.rds} ROUNDS OF` : t.mode === "emom" ? "ONE PER MINUTE" : "MOVEMENTS"}</div>
    ${t.items.map(it => `<div class="mv"><span class="r">${esc(it.r)}</span><span class="n">${esc(it.n)}</span></div>`).join("")}
    <div class="hr"></div>
    <button class="btn pri" id="gStart">START</button>
    <div style="height:9px"></div>
    <div class="grid2"><button class="btn" id="gAgain">🎲 Again</button><button class="btn" id="gSave">Save</button></div>`);
  $("#gStart").onclick = () => { closeSheet(); initAudio(); startRun(t, t.name); };
  $("#gAgain").onclick = () => showGenerated(generate());
  $("#gSave").onclick = () => { const c = JSON.parse(JSON.stringify(t)); c.id = uid(); MYW.unshift(c); saveMyw(); renderTrain(); closeSheet(); toast("Saved to My Workouts"); };
}

/* ==================== LOG ==================== */
function renderLog() {
  const now = Date.now(), wk = HIST.filter(h => now - h.ts < 6048e5).length;
  const days = new Set(HIST.map(h => new Date(h.ts).toDateString()));
  let streak = 0; const d = new Date();
  for (; ;) { if (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); } else if (streak === 0 && days.has(new Date(d.getTime() - 864e5).toDateString())) { d.setDate(d.getDate() - 1); } else break; }
  const mins = Math.round(HIST.reduce((a, h) => a + (h.r.timeSec || 0), 0) / 60);
  $("#logStats").innerHTML = [[HIST.length, "Total"], [wk, "7 days"], [streak, "Streak"], [mins, "Minutes"]]
    .map(([v, k]) => `<div class="stat"><div class="v num">${v}</div><div class="k">${k}</div></div>`).join("");

  const groups = {};
  HIST.forEach(h => { const k = h.name + "||" + h.mode; (groups[k] = groups[k] || []).push(h); });
  const prs = Object.keys(groups).map(k => { const [n, m] = k.split("||"); return { n, m, b: bestFor(n, m), c: groups[k].length }; }).filter(x => x.b);
  prs.sort((a, b) => b.c - a.c);
  $("#prList").innerHTML = prs.length ? prs.map(p => `<div class="card" style="padding:12px"><div class="row">
      <div style="flex:1;min-width:0"><div class="ttl" style="font-size:14.5px">${esc(p.n)}</div><div class="tiny">${MODES.find(m => m.k === p.m).n} · ${p.c} session${p.c === 1 ? "" : "s"}</div></div>
      <div style="text-align:right"><div class="num" style="font-weight:800;font-size:18px;color:var(--ok)">${scoreText(p.m, p.b.r)}</div><div class="tiny">${new Date(p.b.ts).toLocaleDateString()}</div></div></div></div>`).join("")
    : `<div class="tiny" style="padding:2px">Finish a workout and your records show up here.</div>`;

  $("#histList").innerHTML = HIST.length ? HIST.slice(0, 200).map(h => `<button class="card tap" data-h="${h.id}" style="text-align:left;display:block;width:100%">
      <div class="row"><div style="flex:1;min-width:0">
        <div class="ttl" style="font-size:14.5px">${esc(h.name)}</div>
        <div class="tiny">${new Date(h.ts).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })} · ${esc(h.cfgText || "")}</div>
      </div><div class="num" style="font-weight:800;font-size:17px">${scoreText(h.mode, h.r)}</div></div>
      ${h.notes ? `<div class="tiny" style="margin-top:6px;color:var(--mut)">${esc(h.notes)}</div>` : ""}</button>`).join("")
    : `<div class="empty"><div class="big">🏋️</div>No workouts logged yet.<br><span class="tiny">Your history lives on this phone only.</span></div>`;
  $$("[data-h]").forEach(b => b.onclick = () => showHist(b.dataset.h));
}
function showHist(id) {
  const h = HIST.find(x => x.id === id); if (!h) return;
  openSheet(h.name, `
    <div class="card" style="text-align:center"><div class="num" style="font-size:32px;font-weight:800">${scoreText(h.mode, h.r)}</div>
    <div class="tiny">${esc(h.cfgText || "")} · ${new Date(h.ts).toLocaleString()}</div></div>
    ${h.items && h.items.length ? h.items.map(it => `<div class="mv"><span class="r">${esc(it.r || "·")}</span><span class="n">${esc(it.n)}</span></div>`).join("") : ""}
    ${h.splits && h.splits.length ? `<div class="tiny" style="margin:12px 0 6px">SPLITS</div>` + h.splits.map((s, i) => `<div class="row" style="justify-content:space-between;padding:4px 0;font-size:13.5px"><span style="color:var(--mut)">Round ${i + 1}</span><span class="num">${fmtLong(s)}</span></div>`).join("") : ""}
    ${h.notes ? `<div class="hr"></div><div style="color:#d6dae0">${esc(h.notes)}</div>` : ""}
    <div class="hr"></div>
    <div class="grid2"><button class="btn" id="hRedo">Do it again</button><button class="btn bad" id="hDel">Delete</button></div>`);
  $("#hRedo").onclick = () => {
    const p = PRESETS.find(p => p.name === h.name) || MYW.find(w => w.name === h.name);
    closeSheet();
    if (p) { initAudio(); startRun(presetToTM(p), h.name); }
    else { TM.mode = h.mode; TM.items = h.items || []; TM.name = h.name; saveTM(); renderTimer(); go("timer"); }
  };
  $("#hDel").onclick = () => { if (!confirm("Delete this entry?")) return; HIST = HIST.filter(x => x.id !== id); saveHist(); closeSheet(); renderLog(); };
}

/* ==================== SETTINGS ==================== */
$("#btnSettings").onclick = () => {
  openSheet("Settings", `
    <div class="card" style="padding:2px 14px">
      ${[["sound", "Sound cues", "Beeps for countdowns and round changes"],
      ["voice", "Voice callouts", "Speaks the movement or round number"],
      ["flash", "Screen flash", "Flashes the screen at each round — works with the phone on silent"],
      ["wake", "Keep screen awake", "Stops the phone locking mid-workout"]]
      .map(([k, t, d]) => `<div class="sw"><div style="padding-right:12px"><div style="font-weight:650;font-size:14.5px">${t}</div><div class="tiny">${d}</div></div><div class="tog ${S[k] ? "on" : ""}" data-tg="${k}"></div></div>`).join("")}
    </div>
    <label class="fld"><span>Countdown before start</span>
      <select id="stPrep">${[0, 3, 5, 10, 15].map(v => `<option value="${v}" ${S.prep === v ? "selected" : ""}>${v ? v + " seconds" : "None"}</option>`).join("")}</select></label>
    <label class="fld"><span>Your kettlebell (optional)</span><input type="text" id="stKb" value="${esc(S.kbw)}" placeholder="e.g. 24kg"></label>
    <div class="tiny" style="margin-bottom:7px">EQUIPMENT YOU HAVE</div>
    <div class="card" style="padding:2px 14px">
      ${Object.entries(GEAR_LABEL).map(([k, l]) => `<div class="sw"><div style="font-weight:650;font-size:14.5px">${l}</div><div class="tog ${S.gear[k] ? "on" : ""}" data-gr="${k}"></div></div>`).join("")}
    </div>
    <div class="tiny" style="margin:10px 2px">Movements needing gear you don't have are skipped by the random generator.</div>
    <div class="hr"></div>
    <div class="grid2"><button class="btn sm" id="stExport">Copy my data</button><button class="btn sm" id="stImport">Paste data in</button></div>
    <div style="height:9px"></div>
    <button class="btn sm bad gho" id="stReset">Erase everything</button>
    <div class="tiny" style="margin-top:14px;text-align:center;line-height:1.6">IronMinute · 236 movements<br>Everything is stored on this device only.<br>Add to your Home Screen for full-screen mode.</div>
  `);
  $$("[data-tg]").forEach(b => b.onclick = () => { S[b.dataset.tg] = !S[b.dataset.tg]; saveS(); b.classList.toggle("on", S[b.dataset.tg]); if (b.dataset.tg === "sound") updateSoundIcon(); });
  $$("[data-gr]").forEach(b => b.onclick = () => { S.gear[b.dataset.gr] = !S.gear[b.dataset.gr]; saveS(); b.classList.toggle("on", S.gear[b.dataset.gr]); renderLib(); });
  $("#stPrep").onchange = e => { S.prep = +e.target.value; saveS(); };
  $("#stKb").onchange = e => { S.kbw = e.target.value.trim(); saveS(); };
  $("#stExport").onclick = async () => {
    const d = JSON.stringify({ v: 1, hist: HIST, myw: MYW, settings: S });
    try { await navigator.clipboard.writeText(d); toast("Copied — paste it somewhere safe"); }
    catch (e) { openSheet("Your data", `<textarea rows="12" style="font-size:12px">${esc(d)}</textarea><div class="tiny" style="margin-top:8px">Select all and copy.</div>`); }
  };
  $("#stImport").onclick = () => {
    openSheet("Paste your data", `<textarea id="imD" rows="8" placeholder="Paste the exported text here"></textarea><div style="height:10px"></div><button class="btn pri" id="imOk">Restore</button>`);
    $("#imOk").onclick = () => {
      try {
        const d = JSON.parse($("#imD").value);
        if (d.hist) { HIST = d.hist; saveHist(); }
        if (d.myw) { MYW = d.myw; saveMyw(); }
        if (d.settings) { S = Object.assign(S, d.settings); saveS(); }
        renderAll(); closeSheet(); toast("Restored");
      } catch (e) { toast("That didn't look like valid data"); }
    };
  };
  $("#stReset").onclick = () => {
    if (!confirm("Erase all history, saved workouts and settings? This can't be undone.")) return;
    HIST = []; MYW = []; S = JSON.parse(JSON.stringify(DEF_SETTINGS));
    saveHist(); saveMyw(); saveS(); renderAll(); closeSheet(); toast("Erased");
  };
};

/* ==================== INIT ==================== */
function renderAll() { renderTrain(); renderLib(); renderTimer(); renderLog(); }
renderAll();
$("#libSearch").placeholder = "Search " + EX.length + " movements…";
